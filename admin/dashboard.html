<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GAGNE — Dashboard</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <style>
    body {
      background: var(--paper);
      margin: 0;
      padding: 0;
    }
    .dash-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
      border-bottom: 1px solid var(--line);
      margin-bottom: 32px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .dash-header h1 {
      font-family: 'Fraunces', serif;
      font-size: 28px;
      font-weight: 600;
    }
    .dash-header .actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .dash-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-bottom: 36px;
    }
    @media (max-width: 700px) {
      .dash-stats { grid-template-columns: 1fr; }
    }
    .dash-stat {
      background: var(--panel);
      border-radius: var(--radius-m);
      padding: 22px;
      border: 1px solid var(--line);
    }
    .dash-stat b {
      font-family: 'Fraunces', serif;
      font-size: 32px;
      font-weight: 600;
      display: block;
    }
    .dash-stat span {
      font-size: 13px;
      color: var(--ink-soft);
      margin-top: 4px;
      display: block;
    }
    .dash-table {
      border: 1.5px solid var(--ink);
      border-radius: var(--radius-m);
      overflow: hidden;
      margin-top: 16px;
    }
    .dash-row {
      display: grid;
      grid-template-columns: 48px 2fr 1.2fr 0.8fr 1fr;
      align-items: center;
      gap: 14px;
      padding: 12px 18px;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
    }
    .dash-row:last-child { border-bottom: none; }
    .dash-row.head {
      background: var(--panel);
      font-size: 11px;
      color: var(--ink-soft);
      font-weight: 600;
      padding: 10px 18px;
    }
    .dash-thumb {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      flex-shrink: 0;
      background-size: cover;
      background-position: center;
    }
    .dash-title { font-weight: 600; font-size: 13px; }
    .dash-title small {
      display: block;
      font-weight: 400;
      color: var(--ink-soft);
      font-size: 11px;
      margin-top: 2px;
    }
    .dash-actions {
      display: flex;
      gap: 6px;
      justify-content: flex-end;
    }
    .icon-btn {
      width: 30px;
      height: 30px;
      border-radius: 6px;
      border: 1.5px solid var(--line);
      background: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s ease, background 0.2s ease;
      cursor: pointer;
    }
    .icon-btn:hover { border-color: var(--ink); }
    .icon-btn.danger:hover { background: #FBE7E4; border-color: #C1442E; }
    @media (max-width: 760px) {
      .dash-row { grid-template-columns: 36px 1.6fr 1fr; }
      .dash-row .col-price,
      .dash-row .col-actions { display: none; }
      .dash-row.head .col-price,
      .dash-row.head .col-actions { display: none; }
    }

    /* Modal form */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(21, 22, 31, 0.5);
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 20px;
      overflow-y: auto;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.22s ease;
    }
    .modal-overlay.show { display: flex; opacity: 1; }
    .modal {
      background: var(--paper);
      border-radius: var(--radius-m);
      border: 1.5px solid var(--ink);
      max-width: 540px;
      width: 100%;
      padding: 30px;
      transform: translateY(18px) scale(0.98);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .modal-overlay.show .modal { transform: translateY(0) scale(1); }
    .modal h3 {
      font-family: 'Fraunces', serif;
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .modal .modal-sub {
      font-size: 13px;
      color: var(--ink-soft);
      margin-bottom: 22px;
    }
    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 5px;
    }
    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--line);
      border-radius: var(--radius-s);
      font-size: 14px;
      background: var(--white);
      color: var(--ink);
      transition: border-color 0.2s ease;
    }
    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      outline: none;
      border-color: var(--ink);
    }
    .field textarea { resize: vertical; min-height: 60px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .swatches { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
    .swatch {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      position: relative;
    }
    .swatch.selected {
      border-color: var(--ink);
      box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--ink);
    }
    .modal-actions { display: flex; gap: 10px; margin-top: 22px; }
    .modal-actions .btn { flex: 1; justify-content: center; }
    .btn.secondary {
      background: transparent;
      color: var(--ink);
      box-shadow: none;
    }
    .btn.secondary:hover { background: var(--panel); transform: none; box-shadow: none; }

    /* Upload image */
    .upload-area {
      border: 2px dashed var(--line);
      border-radius: var(--radius-s);
      padding: 30px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      background: var(--white);
    }
    .upload-area:hover { border-color: var(--ink); background: var(--panel); }
    .upload-area.dragover { border-color: var(--accent); background: var(--gold-soft); }
    .upload-area .icon { font-size: 32px; display: block; margin-bottom: 8px; }
    .upload-area .text { font-size: 13px; color: var(--ink-soft); }
    .upload-area .hint { font-size: 11px; color: var(--ink-soft); margin-top: 4px; }
    .upload-preview {
      margin-top: 12px;
      display: none;
      position: relative;
    }
    .upload-preview img {
      max-width: 100%;
      max-height: 200px;
      border-radius: var(--radius-s);
      border: 1px solid var(--line);
    }
    .upload-preview .remove {
      position: absolute;
      top: -8px;
      right: -8px;
      background: #C1442E;
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--ink);
      color: var(--paper);
      padding: 12px 24px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 200;
      max-width: 90%;
      text-align: center;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <div class="wrap">
    <!-- Header -->
    <div class="dash-header">
      <h1>📊 Tableau de bord</h1>
      <div class="actions">
        <a href="../index.html" class="btn small" style="background:transparent; color:var(--ink); box-shadow:none; border:1.5px solid var(--line);">Voir la boutique</a>
        <button class="btn small" onclick="logout()" style="background:transparent; color:var(--ink); box-shadow:none; border:1.5px solid var(--line);">Déconnexion</button>
        <button class="btn small gold" id="openAddModal">+ Ajouter un ebook</button>
      </div>
    </div>

    <!-- Stats -->
    <div class="dash-stats" id="dashStats"></div>

    <!-- Table -->
    <h3 style="font-family:'Fraunces',serif; font-size:19px; font-weight:600; margin-bottom:12px;">Tes ebooks</h3>
    <div class="dash-table" id="dashTable"></div>
  </div>

  <!-- ========== FORM MODAL ========== -->
  <div class="modal-overlay" id="formModalOverlay">
    <div class="modal">
      <h3 id="formModalTitle">Ajouter un ebook</h3>
      <p class="modal-sub">Ces informations apparaissent sur la fiche produit.</p>
      <form id="ebookForm">
        <div class="field">
          <label for="f-title">Titre du guide</label>
          <input type="text" id="f-title" required placeholder="Ex. Vendre sur Alibaba" />
        </div>
        <div class="field">
          <label for="f-tagline">Accroche</label>
          <input type="text" id="f-tagline" required placeholder="Une phrase qui donne envie" />
        </div>
        <div class="field">
          <label for="f-desc">Description complète</label>
          <textarea id="f-desc" required placeholder="Ce que le lecteur va apprendre concrètement..."></textarea>
        </div>
        
        <!-- Upload Image -->
        <div class="field">
          <label>Image de couverture</label>
          <div class="upload-area" id="uploadArea">
            <span class="icon">🖼️</span>
            <span class="text">Clique ou dépose une image</span>
            <span class="hint">PNG, JPG, WEBP (max 5MB)</span>
            <input type="file" id="f-image-file" accept="image/*" style="display:none;" />
          </div>
          <div class="upload-preview" id="uploadPreview">
            <img id="previewImage" src="" alt="Aperçu" />
            <button class="remove" onclick="removeImage()">✕</button>
          </div>
          <input type="hidden" id="f-image" value="" />
        </div>

        <div class="field-row">
          <div class="field">
            <label for="f-category">Catégorie</label>
            <input type="text" id="f-category" required placeholder="Ex. Marketing" />
          </div>
          <div class="field">
            <label for="f-level">Niveau</label>
            <select id="f-level">
              <option>Débutant</option>
              <option>Intermédiaire</option>
              <option>Avancé</option>
            </select>
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="f-price">Prix (FCFA)</label>
            <input type="number" id="f-price" step="100" min="0" required placeholder="6 500" />
          </div>
          <div class="field">
            <label for="f-pages">Pages</label>
            <input type="number" id="f-pages" min="1" required placeholder="15" />
          </div>
        </div>
        <div class="field">
          <label for="f-link">Lien de téléchargement</label>
          <input type="url" id="f-link" placeholder="https://..." />
          <p style="font-size:11px; color:var(--ink-soft); margin-top:4px;">Lien où l'utilisateur sera redirigé après paiement</p>
        </div>
        <div class="field">
          <label>Couleur (fallback)</label>
          <div class="swatches" id="swatches"></div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn secondary" id="cancelModal">Annuler</button>
          <button type="submit" class="btn gold" id="submitModalBtn">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ========== TOAST ========== -->
  <div class="toast" id="toast"></div>

  <script src="../config/config.js?v=20260904"></script>
<script src="../assets/js/admin.js?v=20260904"></script>
</body>
</html>
