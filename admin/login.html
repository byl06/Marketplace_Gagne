<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GAGNE — Admin</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--paper);
      padding: 20px;
      margin: 0;
    }
    .login-box {
      max-width: 400px;
      width: 100%;
      background: var(--white);
      border: 1.5px solid var(--ink);
      border-radius: var(--radius-m);
      padding: 40px;
      box-shadow: var(--shadow-hard);
    }
    .login-box .logo {
      font-family: 'Fraunces', serif;
      font-size: 28px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 4px;
    }
    .login-box .sub {
      text-align: center;
      font-size: 14px;
      color: var(--ink-soft);
      margin-bottom: 28px;
    }
    .login-box .field {
      margin-bottom: 16px;
    }
    .login-box .field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 5px;
    }
    .login-box .field input {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--line);
      border-radius: var(--radius-s);
      font-size: 14px;
      background: var(--white);
      color: var(--ink);
      transition: border-color 0.2s ease;
    }
    .login-box .field input:focus {
      outline: none;
      border-color: var(--ink);
    }
    .login-box .btn {
      width: 100%;
      justify-content: center;
      margin-top: 4px;
    }
    .login-box .error {
      color: #C1442E;
      font-size: 13px;
      text-align: center;
      margin-top: 12px;
      display: none;
    }
    .login-box .back-link {
      display: block;
      text-align: center;
      margin-top: 16px;
      font-size: 13px;
      color: var(--ink-soft);
    }
    .login-box .back-link a {
      color: var(--accent);
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <div class="logo">GAGNE</div>
    <p class="sub">🔐 Accès administrateur</p>

    <form id="loginForm">
      <div class="field">
        <label for="email">📧 Email</label>
        <input type="email" id="email" required placeholder="admin@gagne.com" />
      </div>
      <div class="field">
        <label for="password">🔑 Mot de passe</label>
        <input type="password" id="password" required placeholder="••••••••" />
      </div>
      <button type="submit" class="btn gold">Se connecter</button>
      <div class="error" id="loginError">❌ Email ou mot de passe incorrect</div>
    </form>

    <div class="back-link">
      <a href="../index.html">← Retour à la boutique</a>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const error = document.getElementById('loginError');

      // Identifiants cachés dans le code (mais mieux de les mettre dans le backend)
      if (email === 'admin@gagne.com' && password === 'admin123') {
        localStorage.setItem('gagne:admin', JSON.stringify({ email: 'admin@gagne.com', loggedIn: true }));
        window.location.href = 'dashboard.html';
      } else {
        error.style.display = 'block';
        setTimeout(() => error.style.display = 'none', 3000);
      }
    });
  </script>
</body>
</html>
