# ============================================================
#  NETLIFY.TOML - Configuration pour GAGNE
# ============================================================

[build]
  publish = "."
  command = "echo 'Build completed'"

[build.environment]
  PAYDUNYA_MODE = "sandbox"

# ============================================================
#  REDIRECTIONS
# ============================================================
[[redirects]]
  from = "/api/*"
  to = "https://gagne-backend.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/admin/*"
  to = "/admin/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ============================================================
#  HEADERS DE SÉCURITÉ
# ============================================================
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self' 'unsafe-inline' https://*.paydunya.com;"